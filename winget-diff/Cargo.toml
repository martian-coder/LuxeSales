[package]
name = "winget-diff"
version = "0.1.0"
edition = "2021"
description = "Diff two winget export JSON files — see what's missing, extra, or out of date"
license = "MIT"

[[bin]]
name = "winget-diff"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
